version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ava-qdrant
    ports:
      - "6334:6333"  # Using 6334 to avoid conflicts
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  qdrant_storage: